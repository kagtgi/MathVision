<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathVision</title>
    <!--
      Không nạp gì từ internet: bản đóng gói .exe phải chạy được cả khi mạng chặn CDN,
      và lần khởi động đầu không nên chờ mạng. Font Google Sans nằm trong
      public/fonts (bản variable đã cắt còn Latin + dấu tiếng Việt, ~110 KB mỗi file),
      khai báo @font-face trong src/index.css.

      TikZJax được vendor vào public/vendor/tikzjax và vá lại đường dẫn tài nguyên
      (bản gốc hardcode S3 của tikzjax.com cho tex.wasm và core.dump).
    -->
    <link rel="stylesheet" type="text/css" href="./vendor/tikzjax/fonts.css" />
    <script defer src="./vendor/tikzjax/tikzjax.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
